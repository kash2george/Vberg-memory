<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>VBerg board (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
body { font-family:'Reggae One',system-ui,sans-serif; background:#eee8da; color:#2a2218; }
#app { position:fixed; left:0; top:0; width:100%; height:100%; display:flex; flex-direction:column; }

/* ── board ── */
#viewport {
  position:relative; flex:1 1 auto; min-height:0; overflow:hidden;
  touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
  background-image:radial-gradient(rgba(42,34,24,.22) 1px, transparent 1.5px);
}
#viewport.panning { cursor:grabbing; }
#world { position:absolute; left:0; top:0; width:0; height:0; transform-origin:0 0; will-change:transform; }

/* ── small tools, top right ── */
#tools { position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:5; }
#tools button {
  min-width:40px; height:40px; padding:0 10px; border:none; border-radius:10px; cursor:pointer;
  font:15px system-ui,sans-serif; color:inherit; background:rgba(255,255,255,.7);
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
#tools button[aria-pressed="true"] { background:#2a2218; color:#fdfbf7; }

/* ── one entry on the board: its place comes from its order ── */
.hill { position:absolute; width:680px; }
.hill .slot {
  height:381px; border:2px dashed rgba(42,34,24,.3); border-radius:10px;
}
.hill .ground {
  min-height:64px; padding:8px 6px 0; text-align:center; font-size:20px; line-height:1.35;
  word-break:break-word; white-space:pre-wrap;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
}

/* ── input line at the bottom, like a chat window ── */
#bar { flex:0 0 auto; background:#d4c9b0; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
#barRow { display:flex; align-items:flex-end; gap:8px; max-width:900px; margin:0 auto; }
#inp {
  flex:1 1 auto; min-width:0; resize:none; overflow-y:auto;
  font:16px/1.4 'Reggae One',system-ui,sans-serif; color:#2a2218; background:#f5f0e8;
  border:none; border-radius:10px; padding:9px 12px; outline:none;
  max-height:min(40vh, 9.4em);
}
#inp:focus { box-shadow:0 0 0 2px rgba(42,34,24,.25); }
#send {
  flex:0 0 auto; width:42px; height:42px; border:none; border-radius:10px; cursor:pointer;
  font:20px system-ui,sans-serif; background:#2a2218; color:#fdfbf7;
}
#send:disabled { opacity:.35; cursor:default; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="world"></div>
    <div id="tools">
      <button id="btnHome" type="button" title="Go to the newest hill" aria-label="Go to the newest hill">⌂</button>
    </div>
  </div>
  <div id="bar">
    <div id="barRow">
      <textarea id="inp" rows="1" dir="auto" spellcheck="false" autocomplete="off"
                aria-label="Write a sentence or a word"
                placeholder="Write a sentence or a word"></textarea>
      <button id="send" type="button" aria-label="Draw it on the board" disabled>↑</button>
    </div>
  </div>
</div>
<script src="core.js"></script>
<script src="board.js"></script>
</body>
</html>
